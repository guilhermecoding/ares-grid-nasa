<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" fill="none">
  <defs>
    <linearGradient id="skyGloss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9fd4ff" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#1a4a8a" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#061428" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="cellBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c4f9c"/>
      <stop offset="55%" stop-color="#12366e"/>
      <stop offset="100%" stop-color="#0a2248"/>
    </linearGradient>
    <linearGradient id="frameMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8dee8"/>
      <stop offset="50%" stop-color="#9aa3b2"/>
      <stop offset="100%" stop-color="#6b7382"/>
    </linearGradient>
    <linearGradient id="legMetal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a909c"/>
      <stop offset="50%" stop-color="#c4cad4"/>
      <stop offset="100%" stop-color="#5e6570"/>
    </linearGradient>
    <linearGradient id="groundShade" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Ground contact shadow -->
  <ellipse cx="140" cy="186" rx="92" ry="10" fill="url(#groundShade)"/>

  <!-- Rear support legs -->
  <path d="M68 118 L52 178 L62 178 L76 122 Z" fill="url(#legMetal)" opacity="0.95"/>
  <path d="M212 118 L228 178 L218 178 L204 122 Z" fill="url(#legMetal)" opacity="0.95"/>
  <rect x="48" y="176" width="18" height="5" rx="1" fill="#5a5048"/>
  <rect x="214" y="176" width="18" height="5" rx="1" fill="#5a5048"/>

  <!-- Cross brace -->
  <path d="M72 150 H208" stroke="#8a909c" stroke-width="3" stroke-linecap="round"/>
  <circle cx="140" cy="150" r="4" fill="#a8b0bc" stroke="#5e6570" stroke-width="1"/>

  <!-- Front strut -->
  <path d="M140 128 L140 168" stroke="url(#legMetal)" stroke-width="5" stroke-linecap="round"/>
  <rect x="128" y="166" width="24" height="6" rx="1.5" fill="#6b6258"/>

  <!-- Panel body (slight perspective trapezoid feel via transform group) -->
  <g filter="url(#softShadow)">
    <!-- Outer aluminum frame -->
    <path
      d="M36 28 L244 22 L252 118 L28 112 Z"
      fill="url(#frameMetal)"
      stroke="#4a5160"
      stroke-width="1.5"
    />
    <!-- Inner recess -->
    <path
      d="M44 34 L236 28.5 L242 110 L38 105 Z"
      fill="#0c1a30"
    />
    <!-- Active cell surface -->
    <path
      d="M48 38 L232 32.5 L237 106 L43 101 Z"
      fill="url(#cellBlue)"
    />
    <!-- Gloss -->
    <path
      d="M48 38 L232 32.5 L237 106 L43 101 Z"
      fill="url(#skyGloss)"
    />

    <!-- Cell grid — horizontal bus bars -->
    <g stroke="#5ee7ff" stroke-opacity="0.28" stroke-width="0.8">
      <path d="M52 50 L228 45"/>
      <path d="M50 62 L230 57"/>
      <path d="M48 74 L232 69"/>
      <path d="M46 86 L234 81"/>
      <path d="M45 96 L235 91"/>
    </g>
    <!-- Vertical cell dividers -->
    <g stroke="#a8d4ff" stroke-opacity="0.22" stroke-width="0.7">
      <path d="M78 36 L72 103"/>
      <path d="M108 34.5 L104 104"/>
      <path d="M140 33.5 L140 104"/>
      <path d="M172 33 L176 103.5"/>
      <path d="M204 32 L212 102"/>
    </g>
    <!-- Finer cell fingers -->
    <g stroke="#7eb8ff" stroke-opacity="0.12" stroke-width="0.4">
      <path d="M63 37 L58 103"/>
      <path d="M93 35.5 L88 103.5"/>
      <path d="M124 34 L122 104"/>
      <path d="M156 33.5 L158 103.5"/>
      <path d="M188 32.5 L194 102.5"/>
      <path d="M218 32 L224 101"/>
    </g>

    <!-- Top edge highlight -->
    <path d="M44 34 L236 28.5" stroke="#fff" stroke-opacity="0.35" stroke-width="1.2"/>
    <!-- Bottom frame lip -->
    <path d="M28 112 L252 118 L248 124 L32 118 Z" fill="#5e6570"/>
  </g>

  <!-- Junction box -->
  <rect x="128" y="108" width="24" height="12" rx="1.5" fill="#2a3038" stroke="#8a909c" stroke-width="1"/>
  <rect x="132" y="111" width="16" height="3" rx="0.5" fill="#5ee7ff" fill-opacity="0.35"/>

  <!-- Cable -->
  <path d="M140 120 C138 132 132 140 128 152" stroke="#2a2e36" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M140 120 C138 132 132 140 128 152" stroke="#6b7382" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.6"/>
</svg>
